name: CI

# Typecheck + build both packages, plus a real cross-account security
# regression test on the backend (added 2026-09-04, see that step for the
# full why), on every push/PR to main. This is a visibility gate, not a
# blocking one — Render/the frontend deploy still fire on push regardless
# of this workflow's outcome, but a red X on the commit now makes a broken
# push (or a real IDOR/auth regression) impossible to miss instead of only
# showing up as a live production error.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default -- neither job pushes, deploys, or publishes
# anything, so the default GITHUB_TOKEN scope has nothing to use.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a real commit SHA (v4.4.0), not a mutable tag -- a tag
      # can be moved to point at different code without any diff showing
      # up in this repo.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # 22, not 20 -- found 2026-09-04 wiring in the security test:
          # @supabase/supabase-js's realtime client requires a native
          # WebSocket global, which Node 20 doesn't provide, and the
          # backend crashes on startup as a result (confirmed live in this
          # exact CI job). supabase-js's own deprecation warning already
          # names 22 as the fix. Local dev/Render weren't hitting this
          # since this backend build+boot sequence had never run in CI
          # before this test was wired in.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npm run build
      # Vitest unit/integration suite, added 2026-09-14 alongside
      # test-runner-setup — currently just app.test.ts's real /health check
      # (hits live Supabase via the same two secrets as the steps below, so
      # it needs them here too). Runs before the security test boots a real
      # server, since Vitest builds its own app instance and needs no
      # running process.
      #
      # Skipped for Dependabot-triggered runs (added 2026-09-17): GitHub
      # doesn't grant repo secrets to dependabot[bot] PR runs by default,
      # and deliberately not overridden here -- putting the production
      # Supabase service-role key (bypasses RLS) within reach of whatever
      # postinstall code an unreviewed dependency bump brings in is a real
      # supply-chain exposure, not a hypothetical one. This job still runs
      # `npm ci && npm run build` for every Dependabot PR (catches real
      # breakage); a human re-runs the full suite before merging anything.
      - working-directory: backend
        if: github.actor != 'dependabot[bot]'
        run: npm test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # security-test.ts already existed (auth bypass, cross-account IDOR,
      # upload spoofing, input validation, webhook forgery, CORS) but was
      # never run anywhere until 2026-09-04 -- wired in after a security
      # audit found the database's RLS policies are currently decorative
      # (the backend only ever connects with the service-role key, which
      # bypasses RLS), so the ONLY thing stopping one customer from
      # reading/modifying another's data is every route handler's own
      # account_id filter. This is the automated backstop for that: it
      # creates two real, independent @lazyrelay.invalid test accounts
      # (self-cleaning, same pattern the other test-*.ts scripts already
      # use) and asserts Account A can never touch Account B's data. Needs
      # real Supabase credentials since it boots the actual backend --
      # PADDLE_ENVIRONMENT is deliberately left unset so it boots with the
      # stub billing adapter, no Paddle secrets required (index.ts only
      # refuses to start when PADDLE_ENVIRONMENT=production without real
      # MOR credentials).
      # Skipped for Dependabot-triggered runs -- same reasoning as npm test
      # above, none of these should hand a bumped, unreviewed dependency's
      # install/runtime code a live path to production Supabase secrets.
      - working-directory: backend
        if: github.actor != 'dependabot[bot]'
        run: node dist/index.js &
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Needed from 2026-09-04 (the RLS rework) -- security-test.ts's
          # team-access checks build a real per-request authenticated
          # client (anon key + a real JWT) to prove RLS enforcement itself
          # works, not just the API layer. Same public value already
          # embedded in the deployed frontend bundle -- not a secret in
          # the sense the other two vars are, just stored as one for
          # consistency with how it's already handled locally/on Render.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Wait for backend to be ready
        if: github.actor != 'dependabot[bot]'
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "backend is up"
              exit 0
            fi
            sleep 1
          done
          echo "backend never became healthy" >&2
          exit 1
      - working-directory: backend
        if: github.actor != 'dependabot[bot]'
        run: npm run test:security
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Needed from 2026-09-04 (the RLS rework) -- security-test.ts's
          # team-access checks build a real per-request authenticated
          # client (anon key + a real JWT) to prove RLS enforcement itself
          # works, not just the API layer. Same public value already
          # embedded in the deployed frontend bundle -- not a secret in
          # the sense the other two vars are, just stored as one for
          # consistency with how it's already handled locally/on Render.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Stop local backend
        if: always()
        run: pkill -f "node dist/index.js" || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Bumped from 20 to 22 on 2026-09-14, same day node-version was
          # added to this job's test step: jsdom@30 (added for RTL/Vitest)
          # requires Node ^22.22.2, confirmed live via a failed CI run,
          # same underlying "Node 20 isn't enough" issue the backend job
          # already documents above for a different dependency.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      # Vitest/RTL unit suite, added 2026-09-14 — currently just
      # format.test.ts. No env vars needed, runs before the build.
      - working-directory: frontend
        run: npm test
      # Same VITE_* placeholders as deploy-frontend.yml's real secrets —
      # `vite build`'s type-check step needs these env vars to exist, but
      # their actual values don't matter for a build-only run (no deploy
      # happens here), so dummy values keep this workflow independent of
      # repo secrets rather than requiring them to be duplicated/kept in
      # sync for a job that never ships anything.
      - working-directory: frontend
        run: |
          cat > .env.production <<EOF
          VITE_SUPABASE_URL=https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY=placeholder
          VITE_API_URL=https://placeholder.example.com
          VITE_PADDLE_CLIENT_TOKEN=placeholder
          VITE_PADDLE_ENVIRONMENT=sandbox
          EOF
      - working-directory: frontend
        run: npm run build

  # mcp-server, ops, and zapier-integration had zero CI coverage until
  # 2026-09-17 -- every prior green check on a PR touching them was just
  # the unrelated backend/frontend jobs passing. Found while triaging a
  # pile of stale Dependabot PRs: 9 majors in these three directories
  # couldn't be trusted from CI at all, and had to be verified by hand
  # (build/test/live-query, one at a time) before merging.
  #
  # None of the three jobs below ever touch a repo secret, unlike backend
  # above -- same reasoning as that job's Dependabot skip, generalized:
  # an unreviewed dependency bump's install/runtime code should never have
  # a live path to a production credential, Dependabot-triggered or not.
  # That's a real limit on what these jobs can catch (ops has no build
  # step at all, and zapier-integration's actual test suite needs a live
  # LAZYRELAY_API_KEY it deliberately isn't given here -- see that job's
  # own comment) but a real, secret-free check beats the zero coverage
  # that was here before.
  mcp-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mcp-server/package-lock.json
      - working-directory: mcp-server
        run: npm ci
      # This alone is a real check, not a formality -- it's exactly what
      # caught the 2026-09-17 TypeScript 7 break (stopped auto-including
      # @types/* packages, silently broke every Node global) before this
      # job existed to catch it automatically.
      - working-directory: mcp-server
        run: npm run build

  ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ops/package-lock.json
      - working-directory: ops
        run: npm ci
      # No build step or test suite exists for this directory -- these are
      # plain runtime scripts (scheduled tasks, one-off ops), and their
      # real behavior can only be verified against a live Supabase/Resend
      # credential this job deliberately never gets (see the jobs-level
      # comment above). Parse-only (node --check never executes the file)
      # catches a bad bump breaking the syntax/require graph outright --
      # a real but low floor, not a substitute for a live check before
      # anything user-facing changes.
      - name: Syntax-check every .js file (parse only, no execution, no credentials)
        working-directory: ops
        run: find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node --check

  zapier-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: zapier-integration/package-lock.json
      - working-directory: zapier-integration
        run: npm ci
      # This directory's real test suite (`npm test`) hits the live
      # LazyRelay API and needs a real LAZYRELAY_API_KEY -- the
      # authentication-success test has no self-skip guard, it just fails
      # without one. Deliberately NOT wired into CI: that would mean
      # handing a live production API key to every push and PR, including
      # Dependabot's, the exact exposure the jobs-level comment above
      # explains. The live suite stays a manual check (run by hand, most
      # recently 2026-09-17 verifying the mocha/dotenv bumps) instead.
      # Parse-only catches a bad bump breaking the file outright.
      - name: Syntax-check every .js file (parse only, no execution, no credentials)
        working-directory: zapier-integration
        run: find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node --check
