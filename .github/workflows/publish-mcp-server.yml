name: Publish mcp-server to npm

# Trusted publishing (OIDC) -- no stored npm token, nothing that can leak
# or expire. Configured on npmjs.com: @lazyrelay/mcp-server package ->
# Settings -> Trusted Publisher -> GitHub Actions, pointing at exactly
# this workflow filename. Replaces the granular access token in
# ops/config/credentials.local.json used for the 2026-08-17 0.1.1
# release -- npm is restricting 2FA-bypass tokens (already lost
# account-management actions 2026-07-31; loses direct publish entirely
# ~January 2027: github.blog/changelog/2026-07-08-npm-install-time-
# security-and-gat-bypass2fa-deprecation).
#
# Fires on every push touching mcp-server/**, but only actually
# publishes if package.json's version differs from what's already live
# on npm -- so bumping the version and pushing IS the whole release
# process, same as the frontend's own auto-deploy. A push that doesn't
# bump the version is a harmless no-op, not a failure, so this can't
# accidentally spam-publish just from unrelated edits.
#
# The same release also publishes server.json to the official MCP Registry
# (registry.modelcontextprotocol.io), also via GitHub OIDC with no stored
# token. Added 2026-09-14 after the Registry sat at 0.1.3 for three
# releases because nothing pushed to it. A release therefore means bumping
# package.json AND both version fields in server.json.
on:
  push:
    branches: [main]
    paths:
      - "mcp-server/**"
      - ".github/workflows/publish-mcp-server.yml"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    # id-token: write is what lets GitHub mint the OIDC token npm's
    # trusted-publisher exchange needs -- the whole point of this setup.
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: mcp-server
    steps:
      # Pinned to real commit SHAs, not mutable tags -- see ci.yml's own
      # comment for the full rationale.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # npm trusted publishing needs npm CLI 11.5.1+ / Node 22.14+;
          # 24 comfortably clears both and matches what's already
          # proven working for this package locally.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check whether this version is already published
        id: version_check
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view @lazyrelay/mcp-server version 2>/dev/null || echo "none")
          echo "Local version:     $LOCAL_VERSION"
          echo "Published version: $PUBLISHED_VERSION"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      # server.json must carry the same version as package.json, or the
      # Registry would get a stale manifest. Checked BEFORE npm publish so a
      # forgotten bump stops the release before anything goes live.
      - name: Check server.json version matches package.json
        if: steps.version_check.outputs.should_publish == 'true'
        run: |
          PKG=$(node -p "require('./package.json').version")
          SRV=$(jq -r '.version' server.json)
          SRV_PKG=$(jq -r '.packages[0].version' server.json)
          echo "package.json: $PKG | server.json: $SRV / $SRV_PKG"
          if [ "$PKG" != "$SRV" ] || [ "$PKG" != "$SRV_PKG" ]; then
            echo "::error::Bump both version fields in mcp-server/server.json to $PKG"
            exit 1
          fi

      # No token anywhere here -- npm's CLI detects the GitHub Actions
      # OIDC environment automatically once the trusted publisher is
      # configured on npmjs.com, and provenance is attached by default.
      - name: Publish to npm
        if: steps.version_check.outputs.should_publish == 'true'
        run: npm publish --access public

      # MCP Registry: GitHub OIDC login, no stored token (uses the same
      # id-token permission npm already uses). mcp-publisher pinned to v1.8.1
      # and checked against that release's own checksums file.
      - name: Install mcp-publisher
        if: steps.version_check.outputs.should_publish == 'true'
        run: |
          curl -sSfL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Log in to MCP Registry
        if: steps.version_check.outputs.should_publish == 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: steps.version_check.outputs.should_publish == 'true'
        run: ./mcp-publisher publish server.json
