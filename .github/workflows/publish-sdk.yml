name: Publish sdk to npm

# Trusted publishing (OIDC): no stored npm token. Configured on npmjs.com under the package's
# Settings -> Trusted Publisher -> GitHub Actions, pointing at exactly this workflow filename
# (publish-sdk.yml). Bumping the version in sdk/package.json and pushing IS the release. A push that
# does not change the version is a harmless no-op (the check below sees that version is already on
# npm), so unrelated edits can never publish anything by accident.
on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - ".github/workflows/publish-sdk.yml"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: sdk
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # npm trusted publishing needs npm CLI 11.5.1+ / Node 22.14+.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Check whether this version is already published
        id: version_check
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          echo "Local version: $LOCAL_VERSION"
          echo "Versions on npm: $(npm view @lazyrelay/sdk versions --json 2>/dev/null | tr -d '\n ')"
          if npm view @lazyrelay/sdk versions --json 2>/dev/null | grep -q "\"$LOCAL_VERSION\""; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version_check.outputs.should_publish == 'true'
        run: npm publish --access public
