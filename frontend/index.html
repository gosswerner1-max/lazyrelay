    <script>
      // Consent Mode v2 default — MUST run before gtag.js is requested, so
      // no cookie/storage access happens until the visitor actually
      // chooses (see src/components/CookieConsent.tsx, which calls
      // gtag('consent', 'update', ...) once they do). Analytics itself is
      // NOT gated behind this file — GA4 still measures consent-mode
      // "cookieless pings" either way; what's gated is real cookie storage.
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        personalization_storage: 'denied',
      });
      gtag('js', new Date());
      gtag('config', 'G-CNVBJ2076F');
    </script>
