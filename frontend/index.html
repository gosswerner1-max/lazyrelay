<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LazyRelay: Schedule social posts with Proof-of-Publish verification</title>
    <meta name="description" content="LazyRelay schedules your posts across Meta, TikTok, and Pinterest, then independently verifies each one actually went live, not just that it was sent. Free tier available, AI-agent/MCP access on paid plans." />
    <meta property="og:title" content="LazyRelay: Schedule social posts with Proof-of-Publish verification" />
    <meta property="og:description" content="LazyRelay schedules your posts and independently verifies each one actually went live, not just that it was sent." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lazyrelay.com/" />
    <link rel="canonical" href="https://lazyrelay.com/" />
    <script>
      // Consent Mode v2 default — MUST run before gtag.js is requested, so
      // no cookie/storage access happens until the visitor actually
      // chooses (see src/components/CookieConsent.tsx, which calls
      // gtag('consent', 'update', ...) once they do). Analytics itself is
      // NOT gated behind this file — GA4 still measures consent-mode
      // "cookieless pings" either way; what's gated is real cookie storage.
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        personalization_storage: 'denied',
      });
      gtag('js', new Date());
      gtag('config', 'G-CNVBJ2076F');
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CNVBJ2076F"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
